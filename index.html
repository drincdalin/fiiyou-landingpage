  /* Tokens follow the app's Mono theme: black surfaces, thin grey borders, white accent. */
 
  @font-face {
  font-family: "u-regular";
  src: url("./u-regular.ttf") format("truetype");
}

  :root {
    --bg: #ffffff;
    --card: #f4f4f4;
    --border: #d4d4d4;
    --text: #0a0a0a;
    --muted: #666666;
    --accent: #0a0a0a;
    --on-accent: #ffffff;
    --font: "u-regular", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --card: #111111;
      --border: #2f2f2f;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #ffffff;
      --on-accent: #000000;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --card: #111111;
    --border: #2f2f2f;
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --accent: #ffffff;
    --on-accent: #000000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 500 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }

  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 0;
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem clamp(1.25rem, 6vw, 4rem);
  }

  h1 {
    margin: 0 0 0 -.05em; /* cancels the big f's built-in left gap so it lines up with the text below */
    font-weight: 800;
    font-size: clamp(4.5rem, 24vw, 15rem);
    line-height: .9;
    /* keeps the descender of the y from clipping on tight line-height */
    padding-bottom: .06em;
  }

  .slogan {
    margin: .5rem 0 0;
    max-width: 24ch;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    line-height: 1.15;
    font-weight: 600;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  .soon {
    margin: 0;
    margin-top: 20px;
    font-size: clamp(1.35rem, 3.2vw, 2rem);
    line-height: 1.3;
    font-weight: 500;
    color: var(--muted);
  }

  .cta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem 1.5rem;
    margin-top: clamp(1.5rem, 3.5vw, 2.25rem);
  }

  .donate {
    
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    padding: .7rem 2rem;
    margin-top: 0;
    background-color: #ffffff;
    color: var(--on-accent);
    border: 1px solid var(--accent);
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: 650;
    text-decoration: none;
    margin-top: 25px;
    transition: filter .15s, transform .1s;
  }
  .donate:hover { filter: brightness(.88); }
  .donate:active { transform: translateY(1px); }
  .donate:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* one page-load reveal, in reading order */
  .in { animation: in .7s cubic-bezier(.2, .7, .2, 1) backwards; }
  .in:nth-child(2) { animation-delay: .14s; }
  .in:nth-child(3) { animation-delay: .24s; }
  .in:nth-child(4) { animation-delay: .34s; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
